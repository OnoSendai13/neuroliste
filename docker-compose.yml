services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rpps-api
    ports:
      - "127.0.0.1:50000:8000"
      - "127.0.0.1:50001:8000"
    volumes:
      # Repertoire des donnees (base SQLite RPPS + corrections).
      # Surchargeable via la variable d'environnement RPPS_DATA_DIR.
      # Docker Desktop ne partage pas le disque G: du projet : un bind-mount
      # sur ce disque remontait un volume VIDE et la base a ete perdue a chaque
      # recreation du conteneur (15/11/2026). Adapter la valeur par defaut si
      # le depot est utilise sur une autre machine.
      - ${RPPS_DATA_DIR:-C:\Users\neuro\AppData\Local\rpps-neuro\data}:/app/data
      - ${RPPS_DATA_DIR:-C:\Users\neuro\AppData\Local\rpps-neuro\data}\corrections:/app/data/corrections
    environment:
      - DATABASE_URL=sqlite:////app/data/neurologues.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpps-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped