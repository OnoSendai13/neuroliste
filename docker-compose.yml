services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rpps-api
    ports:
      - "127.0.0.1:50000:8000"
      - "127.0.0.1:50001:8000"
    volumes:
      - /home/laurent/.local/share/rpps-neuro/data:/app/data
      - ./data/corrections:/app/data/corrections
    environment:
      - DATABASE_URL=sqlite:////app/data/neurologues.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rpps-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped